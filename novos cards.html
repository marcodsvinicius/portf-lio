<!-- Dependências: Fontes, Tailwind CSS e Ícones -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Estilos Personalizados -->
<style>
  /* Define a fonte Montserrat */
  .font-montserrat {
    font-family: 'Montserrat', sans-serif;
  }
  
  /* Utilitário para Glow com a cor #B7E500 (RGB: 183, 229, 0) */
  .glow-brand {
    box-shadow: 0 0 20px rgba(183, 229, 0, 0.3);
  }
</style>

<!-- Apenas o Grid de Cards para ser injetado em qualquer lugar -->
<div id="projects-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-8 w-full font-montserrat">
  <!-- Os cards serão inseridos aqui via JS -->
</div>

<!-- Lógica JavaScript -->
<script>
  // Dados dos Projetos
  const projects = [
    {
      id: "01",
      category: "Product Design",
      client: "Hub de Obras",
      title: "Transformando a gestão de obras",
      description: "Do caos de planilhas complexas para um software moderno e ágil.",
      tag: "Novo",
      type: "dashboard",
      link: "https://marcodsvinicius.com/hub-de-obras-3-0/"
    },
    {
      id: "02",
      category: "Design System",
      client: "Nelogica",
      title: "Criação e Gerenciamento de Design System",
      description: "Escalando a criação de interfaces e unindo Design e Engenharia.",
      tag: null,
      type: "code",
      link: "https://marcodsvinicius.com/ds-3-0/"
    },
    {
      id: "03",
      category: "Fintech",
      client: "Nelogica",
      title: "Rebalanceamento de Carteira",
      description: "Retendo usuários e agregando valor ao Home Broker B2B.",
      tag: null,
      type: "dashboard_mobile",
      link: "https://marcodsvinicius.com/reb-carteira-3-0/"
    },
    {
      id: "04",
      category: "UX Research",
      client: "Nelogica",
      title: "Tour Guiado",
      description: "Reduzindo a Carga Cognitiva e Otimizando o Onboarding de Usuários.",
      tag: null,
      type: "onboarding",
      link: "https://marcodsvinicius.com/tour-guiado-3-0/"
    }
  ];

  // --- RENDERIZAÇÃO ---
  function renderProjects() {
    const grid = document.getElementById('projects-grid');
    
    // REVERTIDO PARA O ESTILO ANTERIOR:
    // duration-500 (mais rápido)
    // shadow-[0_20px_40px_-10px...] (sombra projetada, não glow total)
    // hover:border-white/20 (borda sutil)
    grid.innerHTML = projects.map(project => `
      <a href="${project.link}" class="group relative bg-[#80c900] hover:bg-[#CCFF00] h-[480px] w-full cursor-pointer overflow-hidden transition-all duration-500 hover:-translate-y-2 hover:shadow-[0_20px_40px_-10px_rgba(128,201,0,0.3)] block">
        
        <!-- Container de Conteúdo -->
        <div class="absolute inset-0 flex flex-col justify-between p-8 z-20 pointer-events-none">
          
          <!-- Header Card -->
          <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-1">
               <div class="flex items-center gap-2">
                  <span class="font-mono text-xs font-bold text-neutral-800 opacity-60">/${project.id}</span>
                  <span class="h-[1px] w-8 bg-neutral-800/20"></span>
                  <span class="font-bold text-xs uppercase tracking-widest text-neutral-900">${project.category}</span>
               </div>
               <span class="text-[10px] font-bold uppercase tracking-wider text-neutral-900/50 mt-1">${project.client}</span>
            </div>

            <div class="flex gap-2">
               ${project.tag ? `
                 <span class="bg-black text-[#80c900] text-[10px] font-black px-3 py-1 uppercase tracking-widest group-hover:text-[#CCFF00]">
                   ${project.tag}
                 </span>` : ''}
            </div>
          </div>

          <!-- Título e Texto -->
          <div class="relative z-10 mt-auto mb-8 pointer-events-auto max-w-xl">
             <h3 class="text-3xl md:text-5xl font-black leading-[0.95] tracking-tight text-neutral-900 mb-6 group-hover:translate-x-2 transition-transform duration-500">
               ${project.title}
             </h3>
             <p class="text-neutral-800 font-medium text-base md:text-lg opacity-80 leading-tight">
               ${project.description}
             </p>
          </div>

          <!-- Footer Card -->
          <div class="flex items-center justify-between border-t border-black/10 pt-4 opacity-60 group-hover:opacity-100 transition-opacity duration-300 pointer-events-auto">
             <span class="text-[10px] uppercase font-bold tracking-widest text-neutral-800">MAIS INFORMAÇÕES</span>
             <i data-lucide="arrow-up-right" class="text-neutral-900 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" width="20" height="20"></i>
          </div>

        </div>

        <!-- Efeito de Ruído/Textura sutil -->
        <div class="absolute inset-0 opacity-[0.05] pointer-events-none mix-blend-overlay" style='background-image: url("data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E")'></div>
      </a>
    `).join('');

    // Inicializa os ícones Lucide após injetar o HTML
    lucide.createIcons();
  }

  // Inicialização ao carregar a página
  document.addEventListener('DOMContentLoaded', () => {
    renderProjects();
    lucide.createIcons();
  });
</script>
