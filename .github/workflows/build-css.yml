name: Build CSS

# Recompila assets/css/tailwind.css sempre que HTML, JS ou o config mudarem,
# e faz o commit do resultado. Assim dá para editar e publicar sem rodar nada localmente.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/js/**'
      - 'assets/css/tailwind.src.css'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Versiona os links de CSS e JS
        run: python3 scripts/versionar-assets.py
      - name: Commit do CSS recompilado
        run: |
          git add assets/css/tailwind.css '*.html'
          if git diff --cached --quiet; then
            echo "nada a atualizar"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: recompila tailwind.css e versiona os assets"
          git push
